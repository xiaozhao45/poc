[package]
name = "poc"
version = "0.1.0"
edition = "2024"
description = "P.O.C. — Project·Operation·Compose 用户态本地版本控制工具"

[lib]
name = "poc_lib"
path = "src/lib.rs"

[[bin]]
name = "poc"
path = "src/bin/poc.rs"

[[bin]]
name = "dpoc"
path = "src/bin/dpoc.rs"

[[bin]]
name = "cpoc"
path = "src/bin/cpoc.rs"

[[bin]]
name = "fpoc"
path = "src/bin/fpoc.rs"

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
gix-config = "0.61.0"
gix-hash = { version = "0.27.0", features = ["sha1"] }
globset = "0.4.20"
ignore = "0.4.33"
jiff = "0.2.37"
redb = "4.3.0"
similar = "3.2.0"
thiserror = "2.0.21"

[target."cfg(unix)".dependencies]
libc = "0.2.189"
