help:
  after: |-
    全局旗标（必须写在命令词之前）：
      -o, --gc         先执行 gc 优化
      -s, --step       不打开任何交互界面，改为留下待办步骤
      -c, --commit     提交待办步骤，然后执行命令
      -q, --cancel     放弃待办步骤
      -p, --no-pager   本次输出不分页
      --dry-run        内存预演并报告，不落盘
      --quiet          只输出结果 id 与错误
      --verbose        额外输出文件清单与逐步细节
      -y, --yes        （预留；1.0 无效果）

    命令词之后的同名旗标归该命令（`-c` 在 `opt` 后是压缩、在 `cmp` 后是合并）。
